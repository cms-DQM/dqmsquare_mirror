{% extends "base.html" %} {% block head %}
<script src="{{ url_for('static', filename='pagination_helper.js') }}"></script>
<title>DQM CMSSW Release comparison results browser</title>
{% endblock %} {% block content %}
<div class="row mt-5">
  <div class="container mt-4">
    <button
      class="btn btn-primary"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#cmsswFormCollapse"
    >
      Filter results
    </button>
    <div class="collapse mt-3" id="cmsswFormCollapse">
      <div class="card card-body">
        <form>
          <div class="row">
            <div class="col-6">
              <div class="row"><h4>Base</h4></div>
              <div class="row">
                <div class="mb-3">
                  <label for="base_cmssw_release_filter" class="form-label"
                    >Release</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="base_cmssw_release_filter"
                    placeholder="Enter release"
                  />
                </div>
              </div>
              <div class="row">
                <div class="mb-3">
                  <label for="comparisonPRs" class="form-label">PRs</label>
                  <select class="form-select" id="comparisonPRs" multiple>
                    <!-- <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option> -->
                    <!-- Add more PRs as needed -->
                  </select>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="row"><h4>Comparison</h4></div>
              <div class="row">
                <div class="mb-3">
                  <label for="comp_cmssw_release_filter" class="form-label"
                    >Release</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="comp_cmssw_release_filter"
                    placeholder="Enter release"
                  />
                </div>
              </div>
              <div class="row">
                <div class="mb-3">
                  <label for="basePRs" class="form-label">PRs</label>
                  <select class="form-select" id="basePRs" multiple>
                    <!-- <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option> -->
                    <!-- Add more PRs as needed -->
                  </select>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<div class="row mt-5">
  <div class="col-lg-4 col-md-12">
    <div class="row mt-1">
      <h5>Available comparisons</h5>
    </div>
    <div class="row">
      <ul class="list-group" id="results-list"></ul>
    </div>
  </div>
  <div class="col-lg-8 col-md-12 flex-column border">
    <object
      type="text/html"
      id="comparison-frame"
      style="min-height: 700px"
      class="container-fluid"
      data=""
    >
      <h2>Click an item from the list on the left.</h2>
    </object>
  </div>
</div>
{% endblock %} {% block script %}
<script>
  const PREFIX = "{{ PREFIX }}";
  const MAX_RESULTS_PER_PAGE = 10;

  // Remove the bootstrap 'active' class from all items
  // in the available reports list.
  function inactive_all_result_items() {
    let results_list = document.getElementById("results-list");
    results_list.childNodes.forEach((child) => {
      child.classList.remove("active");
    });
  }

  // Set (and hence load) the target comparison to show
  // on the comparison frame.
  function set_comparison_frame_contents(id) {
    document
      .getElementById("comparison-frame")
      .setAttribute("data", `/comparison_reports/${id}`);
  }

  // Callback to run when clicking a single comparison item.
  function onclick_specific_comparison(e) {
    inactive_all_result_items();
    e.target.classList.add("active");
    let id = e.target.getAttribute("id");
    set_comparison_frame_contents(id);
    update_arg_in_url("comparison_id", id);
  }

  // Fetch the list of the available comparison reports from the API.
  // Return the json response as a Promise.
  function get_available_comparisons(
    page = 1,
    items_per_page = MAX_RESULTS_PER_PAGE
  ) {
    return fetch(
      `${PREFIX}api/get_cmssw_comparison_reports?${
        page ? "&page=" + page : ""
      }${items_per_page ? "&items_per_page=" + items_per_page : ""}`
    ).then((response) => response.json());
  }

  function filter_cmssw_releases(filter) {
    return fetch(
      `${PREFIX}api/filter_cmssw_comparison_releases/${filter}`
    ).then((response) => response.json());
  }

  // Function to update an argument (arg) to a new value (value)
  // in the URL
  function update_arg_in_url(arg, value) {
    let url = new URL(window.location);
    url.searchParams.set(arg, value);
    window.history.replaceState(null, null, url);
  }

  function get_comparisons_and_update_data(page, pagination) {
    return get_available_comparisons(page, MAX_RESULTS_PER_PAGE).then(
      (data) => {
        pagination.set_data(data.data, data.page, data.total_pages);
        update_arg_in_url("page", data.page);
        // Return an empty response so that
        // we can keep the then chain going.
        return new Promise((resolve) => {
          resolve();
        });
      }
    );
  }

  // Attach to the load event of the window.
  addEventListener("load", (event) => {
    let paramString = window.location.href.split("?")[1];
    let queryString = new URLSearchParams(paramString);
    // URL params. Those control the state that the
    // page will show. If page is set, we start querying
    // the API starting from that page. If comparison_id
    // is set, and it's listed in the currently shown page,
    // it is automatically selected.
    let page = queryString.get("page");
    let comparison_id = queryString.get("comparison_id");
    let base_cmssw_release_filter = queryString.get(
      "base_cmssw_release_filter"
    );
    let comp_cmssw_release_filter = queryString.get(
      "comp_cmssw_release_filter"
    );

    let pagination = pagination_helper(
      "results-list" /* DOM element to attach to */,
      /* On result creation callback. Gets the DOM element created (li)
          and the data corresponding as arg. It must return the li. */
      (li, data) => {
        li.setAttribute("id", data.id);
        li.setAttribute("title", `Comparison ran at ${data.comparison_ran_at}`);
        li.innerHTML = `${data.base_cmssw_release} (${data.base_prs}) vs ${data.comp_cmssw_release} (${data.comp_prs})`;
        li.classList.add("list-group-item", "list-group-item-action");
        li.onclick = onclick_specific_comparison;
        return li;
      },
      /* To be run on each page click */
      (page) => {
        get_comparisons_and_update_data(page, pagination);
      },
      MAX_RESULTS_PER_PAGE /* Items per page to show */
    );
    // First call on page load.
    get_comparisons_and_update_data(page, pagination).then(() => {
      if (comparison_id && document.getElementById(comparison_id)) {
        document.getElementById(comparison_id).click();
      }
    });

    function hide_and_clear_autocomplete_dropdown(el) {
      el.innerHTML = "";
      el.classList.remove("show");
    }
    for (let el of ["base_cmssw_release_filter", "comp_cmssw_release_filter"]) {
      for (let event of ["keyup", "keypress"]) {
        document.getElementById(el).addEventListener(event, () => {
          let filter_el = document.getElementById(el);
          let filter = filter_el.value;
          let parent = filter_el.parentElement;
          let dropdown = null;

          update_arg_in_url(el, filter);

          if (!filter) {
            if (parent.getElementsByTagName("ul").length > 0) {
              dropdown = parent.getElementsByTagName("ul")[0];
              hide_and_clear_autocomplete_dropdown(dropdown);
            }
            return;
          }

          // If a filter is passed, request the available releases
          // that match.
          filter_cmssw_releases(filter).then((data) => {
            if (!data || data.length < 1) {
              if (parent.getElementsByTagName("ul").length > 0) {
                dropdown = parent.getElementsByTagName("ul")[0];
                hide_and_clear_autocomplete_dropdown(dropdown);
              }
              return;
            }
            if (parent.getElementsByTagName("ul").length > 0) {
              dropdown = parent.getElementsByTagName("ul")[0];
              hide_and_clear_autocomplete_dropdown(dropdown);
            } else {
              dropdown = document.createElement("ul");
            }
            dropdown.classList.add("dropdown-menu", "show");
            for (let datum of data) {
              console.log(datum);
              let li = document.createElement("li");
              li.innerHTML = datum.cmssw_version;
              li.classList.add("show");
              dropdown.appendChild(li);
            }
            parent.appendChild(dropdown);
          });
        });
      }
    }
  });
</script>
{% endblock %}
